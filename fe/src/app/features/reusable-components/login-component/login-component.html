<div class="content">
    <div class="wrapper">
    <form class="login-form" (ngSubmit)="login()">
        <app-input-component label="Username" type="text" width="270px" height="30px" [(value)]="username"></app-input-component>
        <app-input-component label="Password" type="password" width="270px" height="30px" [(value)]="password"></app-input-component>
        <div>
            <p class="forgot-password">
            Password dimenticata?
            </p>
            <button matButton="filled" type="submit" class="button-style" [disabled]="isLoading">Accedi</button>
        </div>
    </form>
</div>
</div>
