<div class="wrapper">
    <div>
        <p class="loom-name">{{ 'Telaio ' + serialNumber }}</p>
    </div>
    <span
        class="queue-badge"
        [class.queue-badge-empty]="queueCount === 0"
        aria-label="Elementi in coda">
        {{ queueCount }}
    </span>
    <div>
    <img ngSrc="{{ icon }}" alt="Loom Image" class="loom-image" width="45" height="45">
    </div>
    @if(isDialogMode) {
        <div>
            <app-button-general-action-component
                [label]="'Assegna'"
                [className]="'save-button'"
                (click)="onAssignClick()">
</app-button-general-action-component>
        </div>
    } @else {
        <div class="loom-status-wrapper">
            <span class="loom-status-chip {{ statusChipClass }}">{{ statusLabel }}</span>
            @if(statusLabel === 'In lavorazione' && days) {
                <span class="loom-days">{{ days }}</span>
            }
        </div>
    }
</div>
