<app-decorative-lines-component
  [verticalPositions]="['14%', '55%', '40%']"
  [horizontalPositions]="['3%', '10%', '53%', '56%', '94%']">
</app-decorative-lines-component>

<app-title-page-component  
  title="Articoli"
  imageLink="/icon/itemicon-violet.png"
  [imageWidth]="35"
  [imageHeight]="35"></app-title-page-component>

<div class="body" style="margin-bottom: 20px;">
  <div>
    <app-table-component
    [columns]="columns"
    [rows]="rows()"
    [actions]="actions"
    [addButton]="addButton"
    [filterButton]="filterButton"
    actionColumnHeader=""
    (actionClick)="onTableAction($event)"
    (bulkActionClick)="onTableBulkAction($event)"
    (filterSelected)="onFilterSelected($event)">
    </app-table-component>
  </div>
</div>

<app-title-page-component  
  title="Articoli Archiviati"
  imageLink="/icon/itemicon-violet.png"
  [imageWidth]="35"
  [imageHeight]="35"></app-title-page-component>


<div class="body">
  <div>
    <app-table-component
    [columns]="columns"
    [rows]="archivedRows()"
    [actions]="actions"
    [addButton]="addButton"
    [filterButton]="filterButton"
    actionColumnHeader=""
    (actionClick)="onTableAction($event)"
    (bulkActionClick)="onTableBulkAction($event)"
    (filterSelected)="onArchivedFilterSelected($event)">
    </app-table-component>
  </div>
  
  <app-white-panel [title]="'Nota Bene'" [text]="'Con la Riabilitazione dell’Articolo si intende il ripristino inmodo tale che possa essere iniziata una nuova produzione dello stesso articolo. Sarà necessario controllare se i dati inseriti sono corretti, nella pagina relativa alle Anagrafiche Articoli.'"></app-white-panel> 
</div>
