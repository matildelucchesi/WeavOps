<app-decorative-lines-component
  [verticalPositions]="['14%', '55%', '40%']"
  [horizontalPositions]="['3%', '10%', '53%', '56%', '94%']">
</app-decorative-lines-component>

<app-title-page-component  
  title="Articoli"
  imageLink="/icon/itemicon-violet.png"
  [imageWidth]="35"
  [imageHeight]="35"></app-title-page-component>

<div class="body" style="margin-bottom: 20px;">
  <div>
    <app-table-component
    [columns]="columns"
    [rows]="rows()"
    [actions]="actions"
    [addButton]="addButton"
    [filterButton]="filterButton"
    actionColumnHeader=""
    (actionClick)="onTableAction($event)"
    (bulkActionClick)="onTableBulkAction($event)"
    (filterSelected)="onFilterSelected($event)">
    </app-table-component>
  </div>
</div>

<app-title-page-component  
  title="Articoli Archiviati"
  imageLink="/icon/itemicon-violet.png"
  [imageWidth]="35"
  [imageHeight]="35"></app-title-page-component>


<div class="body">
  <div>
    <app-table-component
    [columns]="columns"
    [rows]="archivedRows()"
    [actions]="actions"
    [filterButton]="filterButton"
    actionColumnHeader=""
    (actionClick)="onTableAction($event)"
    (bulkActionClick)="onTableBulkAction($event)"
    (filterSelected)="onArchivedFilterSelected($event)">
    </app-table-component>
  </div>
  
  <app-white-panel style="display: flex;margin-top: 20px;" [title]="'Nota Bene'" [text]="'Con la Riabilitazione dell’Articolo si intende il ripristino inmodo tale che possa essere iniziata una nuova produzione dello stesso articolo. Sarà necessario controllare se i dati inseriti sono corretti, nella pagina relativa alle Anagrafiche Articoli.'"></app-white-panel> 

  <app-white-panel [iconName]="'category'" [title]="'Legenda'">
    <div class="item-legend">
      <div class="item-legend-row">
        <span class="item-legend-chip item-legend-chip-initialized">Inizializzato</span>
        <span class="item-legend-description">L'articolo è stato inizializzato.</span>
      </div>

      <div class="item-legend-row">
        <span class="item-legend-chip item-legend-chip-production">In produzione</span>
        <span class="item-legend-description">L'articolo è in produzione. Clicca su <mat-icon>visibility</mat-icon> per vedere lo stato.</span>
      </div>

      <div class="item-legend-row">
        <span class="item-legend-chip item-legend-chip-completed">Completato</span>
        <span class="item-legend-description">La produzione dell'articolo è stata completata.</span>
      </div>

      <div class="item-legend-row">
        <span class="item-legend-chip item-legend-chip-stopped">Abbandonato</span>
        <span class="item-legend-description">L'articolo è stato abbandonato.</span>
      </div>
    </div>
  </app-white-panel>

</div>
