<app-decorative-lines-component
  [verticalPositions]="['54%', '55%', '83%', '86%', '50%', '16%', '15%']"
  [horizontalPositions]="['11%', '17%', '53%', '56%', '94%']">
</app-decorative-lines-component>

@if (isRefreshingLooms()) {
  <app-loader-component [ariaLabel]="'Aggiornamento lista telai in corso'"></app-loader-component>
}

<app-title-page-component  
  title="Telai"
  imageLink="/icon/loomicon-violet.png"
  [imageWidth]="50"
  [imageHeight]="50"></app-title-page-component>

<div class="body">
  <div>
    <app-table-component
    [columns]="columns"
    [rows]="rows()"
    [actions]="actions"
    [addButton]="addButton"
    [filterButton]="filterButton"
    actionColumnHeader=""
    (addButtonClick)="openNewLoomDialog()"
    (actionClick)="onTableAction($event)"
    (bulkActionClick)="onTableBulkAction($event)"
    (filterSelected)="onFilterSelected($event)">
    </app-table-component>
  </div>

  <app-white-panel [text]="'Per poter assegnare una LAVORAZIONE al telaio è necessario farlo dalla pagina di Anagrafiche Articoli.'"></app-white-panel> 
  <app-white-panel [iconName]="'category'" [title]="'Legenda'" [text]="'Per poter assegnare un ARTICOLO al telaio è necessario farlo dalla pagina di Anagrafiche Articoli.'"></app-white-panel>
</div>
