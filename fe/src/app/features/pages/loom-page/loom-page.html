@if (isRefreshingLooms()) {
  <app-loader-component [ariaLabel]="'Aggiornamento lista telai in corso'"></app-loader-component>
}

<app-title-page-component  
  title="Telai"
  imageLink="/icon/loomicon-violet.png"
  [imageWidth]="50"
  [imageHeight]="50"></app-title-page-component>

<div class="body">
  <div>
    <app-table-component
    [columns]="columns"
    [rows]="rows()"
    [actions]="actions"
    [addButton]="addButton"
    [filterButton]="filterButton"
    actionColumnHeader=""
    (addButtonClick)="openNewLoomDialog()"
    (actionClick)="onTableAction($event)"
    (bulkActionClick)="onTableBulkAction($event)"
    (filterSelected)="onFilterSelected($event)">
    </app-table-component>
  </div>

  <app-white-panel [text]="'Per assegnare un processo di produzione ad un telaio, è necessario farlo dalla pagina di dettaglio dell\'articolo che si desidera produrre, accedibile dalla pagina di Anagrafiche Articoli.'"></app-white-panel> 
  <app-white-panel [iconName]="'category'" [title]="'Legenda'">
    <div class="loom-legend">
      <div class="loom-legend-row">
        <span class="loom-legend-chip loom-legend-chip-working">In lavorazione</span>
        <span class="loom-legend-description">Il telaio sta lavorando un articolo.</span>
      </div>

      <div class="loom-legend-row">
        <span class="loom-legend-chip loom-legend-chip-maintenance">Manutenzione</span>
        <span class="loom-legend-description">Il telaio è in manutenzione.</span>
      </div>

      <div class="loom-legend-row">
        <span class="loom-legend-chip loom-legend-chip-stopped">Fermo</span>
        <span class="loom-legend-description">Il telaio è disponibile o non sta lavorando.</span>
      </div>
    </div>
  </app-white-panel>
</div>
