<app-decorative-lines-component
  [verticalPositions]="['24%', '25%', '43%', '75%','91%', '94%', '92%']"
  [horizontalPositions]="['2%','15%', '17%', '30%', '53%', '56%', '94%']">
</app-decorative-lines-component>

<div class="title-wrapper">
  <app-title-page-component
  [title]="title"
  iconName="history"
  [imageWidth]="40"
  [imageHeight]="40">
</app-title-page-component>
</div>

<app-exit-button-component></app-exit-button-component>

<div class="body">
  <div class="history-table-wrapper">
    <app-table-component
      [columns]="columns"
      [rows]="rows()"
      [filterButton]="filterButton"
      [enableMultiSelection]="false"
      [sortByCreationDate]="false"
      (filterSelected)="onFilterSelected($event)"
      (actionClick)="onTableAction($event)">
    </app-table-component>
  </div>
</div>
