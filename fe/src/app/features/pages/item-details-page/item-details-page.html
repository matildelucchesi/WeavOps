<app-decorative-lines-component
  [verticalPositions]="['14%', '55%', '40%']"
  [horizontalPositions]="['3%', '10%', '53%', '56%', '94%']"
/>

<app-title-page-component  
  [title]="pageTitle"
  imageLink="/icon/itemicon-violet.png"
  imageAlt="Icona articoli"
  [imageWidth]="35"
  [imageHeight]="35"
/>

<div class="body">
  <div class="button-wrapper">
    <app-exit-button-component></app-exit-button-component>
  </div>
  <div class="content-wrapper">
    <div class="text-pattern">
      <div class="button-wrapper">
      <button type="button" class="button-style button-margin" (click)="toggleEditMode()">
          <mat-icon style="font-size: 20px; align-content: center;">{{ editButtonIcon }}</mat-icon>
          {{ editButtonLabel }}
      </button>
    </div>
    </div>
    <div class="content-padding">
      <div class="arrangement-data">
        <div class="section-title">
          <img class="arrangement-icon" src="/icon/arrangement-icon.png" width="30" height="30" alt="Arrangement Icon">
          <h2>Dati Disposizione</h2>
        </div>

        @if (arrangementData; as arrangement) {
          <form class="data-form">
            <div class="item-data">
              <div class="column">
                <div class="form-group">
                  <label for="itemName">Nome Articolo</label>
                  <input
                    type="text"
                    id="itemName"
                    name="itemName"
                    [(ngModel)]="arrangement.itemName"
                    [readonly]="!isEditEnabled"
                    [class.input-readonly]="!isEditEnabled">
                </div>
                <div class="form-group">
                  <label for="piecesCount">Numero Pezze</label>
                  <input
                    type="number"
                    id="piecesCount"
                    name="piecesCount"
                    [(ngModel)]="arrangement.piecesCount"
                    [readonly]="!isEditEnabled"
                    [class.input-readonly]="!isEditEnabled">
                </div>
                <div class="form-group">
                  <label for="pieceLength">Lunghezza Pezza (m)</label>
                  <input
                    type="number"
                    id="pieceLength"
                    name="pieceLength"
                    [(ngModel)]="arrangement.pieceLength"
                    [readonly]="!isEditEnabled"
                    [class.input-readonly]="!isEditEnabled">
                </div>
                <div class="form-group">
                  <label for="hitsPerDm">Numero Colpi (per dm)</label>
                  <input
                    type="number"
                    id="hitsPerDm"
                    name="hitsPerDm"
                    [(ngModel)]="arrangement.hitsPerDm"
                    [readonly]="!isEditEnabled"
                    [class.input-readonly]="!isEditEnabled">
                </div>
              </div>

              <div class="column">
                <div class="reed-group">
                  <div class="form-group">
                    <label for="reedCount">Misura Pettine</label>
                    <div class="input-with-unit">
                      <input
                        type="number"
                        class="reed-input"
                        id="reedCount"
                        name="reedCount"
                        [(ngModel)]="arrangement.reedCount"
                        [readonly]="!isEditEnabled"
                        [class.input-readonly]="!isEditEnabled">
                      in
                      <input
                        type="number"
                        class="reed-input"
                        id="reedCM"
                        name="reedCM"
                        [(ngModel)]="arrangement.reedCM"
                        [readonly]="!isEditEnabled"
                        [class.input-readonly]="!isEditEnabled">
                      cm
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <label for="reedHeight">Altezza pettine (m)</label>
                  <input
                    type="number"
                    id="reedHeight"
                    name="reedHeight"
                    [(ngModel)]="arrangement.reedHeight"
                    [readonly]="!isEditEnabled"
                    [class.input-readonly]="!isEditEnabled">
                </div>
                <div class="form-group">
                  <label for="warpLength">Lunghezza ordito (m)</label>
                  <input
                    type="number"
                    id="warpLength"
                    name="warpLength"
                    [(ngModel)]="arrangement.warpLength"
                    [readonly]="!isEditEnabled"
                    [class.input-readonly]="!isEditEnabled">
                </div>
                <div class="form-group">
                  <label for="warpEndCount">Numero fili ordito</label>
                  <input
                    type="number"
                    id="warpEndCount"
                    name="warpEndCount"
                    [(ngModel)]="arrangement.warpEndCount"
                    [readonly]="!isEditEnabled"
                    [class.input-readonly]="!isEditEnabled">
                </div>
              </div>

              <div class="column">
                <div class="form-group">
                  <label for="deliveryDate">Data di consegna</label>
                  <input
                    type="text"
                    id="deliveryDate"
                    name="deliveryDate"
                    [ngModel]="formatDate(arrangement.deliveryDate)"
                    (ngModelChange)="arrangement.deliveryDate = $event"
                    [readonly]="!isEditEnabled"
                    [class.input-readonly]="!isEditEnabled">
                </div>
                <div class="form-group"></div>
                <div class="button-wrapper">
                  <button
                    type="button"
                    class="button-qr"
                    aria-label="Esporta Disposizione"
                    (click)="exportArrangementData()">
                    <span class="qr-mark" aria-hidden="true">
                      <mat-icon
                        class="button-qr-icon material-symbols-outlined"
                        fontSet="material-symbols-outlined">
                        qr_code_2
                      </mat-icon>
                    </span>
                    <span class="button-qr-copy">
                      <span>Esporta Disposizione</span>
                      <small>Genera QR Code telai</small>
                    </span>
                  </button>
                </div>
              </div>
            </div>
            
          </form>
          
        } @else {
          <p class="empty-state">Dati disposizione non disponibili</p>
                    }
            </div>
      <div class="production-data">
          <div class="section-title">
            <img class="work-icon" src="/icon/work-icon-violet.png" width="30" height="30" alt="Work Icon">
            <h2>Dati Produzione</h2>
          </div>
          @if (itemData; as item) {
            <form class="data-form">
              <div class="item-data">
                <div class="column">
                  <div class="form-group">
                    <label for="totalMeters">Metri Totali</label>
                    <input
                      type="number"
                      id="totalMeters"
                      name="totalMeters"
                      [(ngModel)]="item.totalMeters"
                      [readonly]="!isEditEnabled"
                      [class.input-readonly]="!isEditEnabled">
                  </div>
                  <div class="form-group">
                    <label for="metersRun">Metri Totali Prodotti</label>
                    <input
                      type="number"
                      id="metersRun"
                      name="metersRun"
                      [(ngModel)]="item.metersRun"
                      [readonly]="!isEditEnabled"
                      [class.input-readonly]="!isEditEnabled">
                  </div>
                  <div class="form-group">
                    <label for="metersToGo">Metri Mancanti</label>
                    <input
                      type="number"
                      id="metersToGo"
                      name="metersToGo"
                      [value]="getMetersToGo()"
                      [readonly]="true"
                      [class.input-readonly]="true">
                  </div>
                </div>
                <div class="column">
                  <div class="form-group">
                    <label for="startDate">Data Inizio Lavorazione</label>
                    <input
                      type="text"
                      id="startDate"
                      name="startDate"
                      [(ngModel)]="item.startDate"
                      [readonly]="!isEditEnabled"
                      [class.input-readonly]="!isEditEnabled">
                  </div>
                  <div class="form-group">
                    <label for="expectedEndDate" style="white-space: nowrap;">Data Fine Lavorazione Prevista</label>
                    <input
                      type="text"
                      id="expectedEndDate"
                      name="expectedEndDate"
                      [(ngModel)]="item.expectedEndDate"
                      [readonly]="!isEditEnabled"
                      [class.input-readonly]="!isEditEnabled">
                  </div>
                  <div class="form-group">
                    
                </div>
                </div>
                <div class="column">
                  <div class="form-group">
                    <label for="percentage">Percentuale Completamento</label>
                    <input
                      type="number"
                      id="percentage"
                      name="percentage"
                      [value]="getPercentage()"
                      [readonly]="true"
                      [class.input-readonly]="true">
                </div>
                <div class="form-group">
                </div>
                <div class="button-wrapper">
                  <button
                    type="button"
                    class="button-qr"
                    aria-label="Termina Produzione"
                    [disabled]="isTerminated"
                    (click)="openTerminateProductionDialog()">
                    <span class="qr-mark" aria-hidden="true">
                      <mat-icon
                        class="button-qr-icon material-symbols-outlined"
                        fontSet="material-symbols-outlined">
                        {{ isTerminated ? 'task_alt' : 'flag' }}
                      </mat-icon>
                    </span>
                    <span class="button-qr-copy">
                      <span>{{ isTerminated ? 'Produzione terminata' : 'Termina Produzione' }}</span>
                      <small>{{ isTerminated ? 'Stato aggiornato' : 'Completa o abbandona' }}</small>
                    </span>
                  </button>
                </div>
              </div>
              </div>
            </form>
          }
      </div>
      <div class="content-padding">
        <div class="production-table">
        <div class="section-title">
          <img class="loom-icon" src="/icon/loomicon-violet.png" width="40" height="40" alt="Loom Icon">
          <h2>Telai previsti per la Lavorazione</h2>
        </div>
        <div class="button-wrapper">
          <button
          type="button"
          class="button-style"
          (click)="openAssignLoomDialog()">
          <mat-icon style="font-size: 20px; align-content: center;">add</mat-icon>
          Aggiungi Telaio
        </button>
        </div>
        
        <div>
          <app-table-component
            [columns]="processesColumns"
            [rows]="rows()"
            [enableMultiSelection]="false">
          </app-table-component>
        </div>
      </div>
      </div>
      
    </div>
    <div class="text-pattern-inverse"></div>
    </div>
  <app-white-panel [title]="'Attenzione'" [text]="'Se viene contrassegnata la produzione come TERMINATA, allora l’Articolo verrà inserito nella lista degli Articoli TERMINATI e saranno liberati immediatamente tutti i Telai. è possibile riabilitare l’Articolo per la produzione spuntando la casella Riabilita dalla Lista degli articoli TERMINATI.'"></app-white-panel>
</div>
