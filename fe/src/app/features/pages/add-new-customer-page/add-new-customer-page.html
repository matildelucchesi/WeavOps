<app-decorative-lines-component
  [verticalPositions]="['24%', '25%', '43%', '75%','91%', '94%', '92%']"
  [horizontalPositions]="['2%','15%', '17%', '30%', '53%', '56%', '94%']">
</app-decorative-lines-component>

<div class="title-wrapper">
  <app-title-page-component
  title="Aggiungi Nuovo Cliente"
  iconName="group"
  [imageWidth]="40"
  [imageHeight]="40">
</app-title-page-component>
</div>
@if (isSaving()) {
  <app-loader-component [ariaLabel]="'Salvataggio cliente in corso'"></app-loader-component>
}
<div class="body">
  <div class="button-wrapper">
    <app-exit-button-component></app-exit-button-component>
  </div>
  <div class="data">
    <div class="section-title">
        <mat-icon class="icon">person_add</mat-icon>    
      <h3>Inserisci Dati Nuovo Cliente</h3>
    </div>
    <div style="padding: 20px;">
        <form class="data-form">
        <div class="customer-data">
            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" id="name" name="name" [(ngModel)]="customerName" required>
            </div>
            <div class="form-group-with-icon">
                <label class="input-with-icon-label" for="email">Email</label>
                <div class="input-with-icon">
                    <mat-icon class="icon">email</mat-icon>
                    <input type="email" id="email" name="email" [(ngModel)]="customerEmail" required>
                </div>
            </div>
        </div>
        <h3 style="font-size: 17px;">Referenti</h3>
        <div class="referents-data-wrapper">
            <div class="referents-data">
                <p class="numbers">1.</p>
                <div class="form-group">
                    <label for="referent-name-1">Nome</label>
                    <input type="text" id="referent-name-1" name="referent-name-1" [(ngModel)]="referentName1"> 
                </div>  
                <div class="form-group">
                    <label for="referent-surname-1">Cognome</label>
                    <input type="text" id="referent-surname-1" name="referent-surname-1" [(ngModel)]="referentSurname1"> 
                </div>  
                <div class="form-group-with-icon">
                <label class="input-with-icon-label" for="referent-phone-1">Numero di Telefono</label>
                <div class="input-with-icon">
                    <mat-icon class="icon">phone</mat-icon>
                    <input type="tel" id="referent-phone-1" name="referent-phone-1" [(ngModel)]="referentPhone1">
                </div>
                </div>
            </div>
            <hr style="margin: 20px 0;">
            <div class="referents-data">
                <p class="numbers">2.</p>
                <div class="form-group">
                    <label for="referent-name-2">Nome</label>
                    <input type="text" id="referent-name-2" name="referent-name-2" [(ngModel)]="referentName2"> 
                </div>  
                <div class="form-group">
                    <label for="referent-surname-2">Cognome</label>
                    <input type="text" id="referent-surname-2" name="referent-surname-2" [(ngModel)]="referentSurname2"> 
                </div>  
                <div class="form-group-with-icon">
                <label class="input-with-icon-label" for="referent-phone-2">Numero di Telefono</label>
                <div class="input-with-icon">
                    <mat-icon class="icon">phone</mat-icon>
                    <input type="tel" id="referent-phone-2" name="referent-phone-2" [(ngModel)]="referentPhone2">
                </div>
                </div>
            </div>
        </div>
        <div>
            <h3 style="font-size: 17px;">Note</h3>
            <textarea class="textarea" rows="4" name="note" [(ngModel)]="note"></textarea>
        </div>
    </form>
    <div class="button-wrapper">
        <app-button-general-action-component
        label="Salva"
        className="save-button"
        (click)="createNewCustomer()"></app-button-general-action-component>
    </div>
    </div>
    
  </div>
</div>
