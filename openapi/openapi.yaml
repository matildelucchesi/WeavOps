openapi: 3.0.3

info:
  title: Demo API
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /looms:
    $ref: './paths/loom.yaml#/~1looms'
  /looms/delete-multi:
    $ref: './paths/loom.yaml#/~1looms~1delete-multi'
  /looms/{id}:
    $ref: './paths/loom.yaml#/~1looms~1{id}'
  /looms/{id}/add-pieces:
    $ref: './paths/loom.yaml#/~1looms~1{id}~1add-pieces'
  /items:
    $ref: './paths/item.yaml#/~1items'
  /items/delete-multi:
    $ref: './paths/item.yaml#/~1items~1delete-multi'
  /items/{id}:
    $ref: './paths/item.yaml#/~1items~1{id}'
  /items/{id}/remaining-meters-to-assign:
    $ref: './paths/item.yaml#/~1items~1{id}~1remaining-meters-to-assign'
  /items/with-arrangement:
    $ref: './paths/item.yaml#/~1items~1with-arrangement'
  /items/items-not-archived:
    $ref: './paths/item.yaml#/~1items~1items-not-archived'
  /items/items-archived:
    $ref: './paths/item.yaml#/~1items~1items-archived'
  /arrangements:
    $ref: './paths/arrangement.yaml#/~1arrangements'
  /arrangements/{id}:
    $ref: './paths/arrangement.yaml#/~1arrangements~1{id}'
  /referents:
    $ref: './paths/referent.yaml#/~1referents'
  /referents/{id}:
    $ref: './paths/referent.yaml#/~1referents~1{id}'
  /processes:
    $ref: './paths/process.yaml#/~1processes'
  /processes/{id}:
    $ref: './paths/process.yaml#/~1processes~1{id}'
  /loom-item-assignments:
    $ref: './paths/loom-item-assignment.yaml#/~1loom-item-assignments'
  /loom-item-assignments/{id}:
    $ref: './paths/loom-item-assignment.yaml#/~1loom-item-assignments~1{id}'
  /loom-item-assignments/loom/{loomId}:
    $ref: './paths/loom-item-assignment.yaml#/~1loom-item-assignments~1loom~1{loomId}'
  /loom-item-assignments/loom/{loomId}/running:
    $ref:  './paths/loom-item-assignment.yaml#/~1loom-item-assignments~1loom~1{loomId}~1running'
  /loom-item-assignments/item/{itemId}:
    $ref: './paths/loom-item-assignment.yaml#/~1loom-item-assignments~1item~1{itemId}'
  /customers:
    $ref: './paths/customer.yaml#/~1customers'
  /customers/delete-multi:
    $ref: './paths/customer.yaml#/~1customers~1delete-multi'
  /customers/{id}:
    $ref: './paths/customer.yaml#/~1customers~1{id}'
  /users:
    $ref: './paths/user.yaml#/~1users'
  /users/{id}:
    $ref: './paths/user.yaml#/~1users~1{id}'
  /auth/login:
    $ref: './paths/user.yaml#/~1auth~1login'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
