/items:
  get:
    summary: Recupera tutti i item
    operationId: getItems
    tags:
      - Item
    responses:
      '200':
        description: Lista item
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/item.yaml'

  post:
    summary: Crea un item
    operationId: createItem
    tags:
      - Item
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/item.yaml'
    responses:
      '201':
        description: Item creato
        content:
          application/json:
            schema:
              $ref: '../schemas/item.yaml'
      '400':
        description: Richiesta non valida

/items/delete-multi:
  post:
    tags:
      - Item
    summary: Elimina più articoli contemporaneamente
    operationId: deleteMultiItems
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
    responses:
      '200':
        description: ok
        content:
          application/json:
            schema:
              type: object
              properties:
                deletedCount:
                  type: integer
                  description: Numero di articoli eliminati

/items/{id}:
  get:
    summary: Recupera un item tramite ID
    operationId: getItemById
    tags:
      - Item
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Item trovato
        content:
          application/json:
            schema:
              $ref: '../schemas/item.yaml'
      '404':
        description: Item non trovato

  put:
    summary: Aggiorna un item
    operationId: updateItem
    tags:
      - Item
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/item.yaml'
    responses:
      '200':
        description: Item aggiornato
        content:
          application/json:
            schema:
              $ref: '../schemas/item.yaml'
      '400':
        description: Richiesta non valida
      '404':
        description: Item non trovato

  delete:
    summary: Elimina un item
    operationId: deleteItem
    tags:
      - Item
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '204':
        description: Item eliminato
      '404':
        description: Item non trovato

/items/{id}/remaining-meters-to-assign:
  get:
    summary: Recupera i metri ancora da assegnare a un item
    operationId: getRemainingMetersToAssign
    tags:
      - Item
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Metri ancora da assegnare
        content:
          application/json:
            schema:
              type: integer
      '404':
        description: Item non trovato

/items/with-arrangement:
  post:
    summary: Crea item con disposizione e customerName
    operationId: createItemWithArrangement
    tags:
      - Item
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/create-item-with-arrangement-request.yaml'
    responses:
      '201':
        description: Item creato
        content:
          application/json:
            schema:
              $ref: '../schemas/item.yaml'
      '400':
        description: Richiesta non valida
      '404':
        description: Customer non trovato

/items/items-not-archived:
  get:
    summary: Recupera tutti i item non archiviati
    operationId: getItemsNotArchived
    tags:
      - Item
    responses:
      '200':
        description: Lista item non archiviati
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/item.yaml'

/items/items-archived:
  get:
    summary: Recupera tutti i item archiviati
    operationId: getItemsArchived
    tags:
      - Item
    responses:
      '200':
        description: Lista item archiviati
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/item.yaml'
