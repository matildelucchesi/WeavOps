type: object

required:
  - name
  - email

properties:
  id:
    type: string
    description: Identificativo MongoDB generato dal server
    readOnly: true
  name:
    type: string
  referents:
    type: array
    items:
      $ref: './referent.yaml'
  items:
    type: array
    items:
      $ref: './item.yaml'
  note:
    type: string
  email:
    type: string
  

