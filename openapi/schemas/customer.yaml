type: object

required:
  - name
  - vatNumber
  - email

properties:
  id:
    type: string
    description: Identificativo MongoDB generato dal server
    readOnly: true
  name:
    type: string
  referents:
    type: array
    items:
      $ref: './referent.yaml'
  items:
    type: array
    items:
      $ref: './item.yaml'
  note:
    type: string
  email:
    type: string
  


  vatNumber:
    type: string
    pattern: '^[A-Za-z0-9]+$'
    description: Partita IVA alfanumerica obbligatoria, senza limite di 11 caratteri.
  destinationIds:
    type: array
    description: Destinazioni condivise associate al cliente.
    items:
      type: string
  street:
    type: string
    description: Via o piazza del cliente.
  streetNumber:
    type: string
    description: Numero civico, inclusi suffissi o SNC.
  postalCode:
    type: string
    maxLength: 20
    description: Codice postale; cinque cifre per gli indirizzi italiani.
  city:
    type: string
    description: Comune del cliente.
  provinceCode:
    type: string
    maxLength: 100
    description: Provincia o regione; due lettere per gli indirizzi italiani.
  country:
    type: string
    maxLength: 100
    description: Nazione del cliente; assente se non specificata.
