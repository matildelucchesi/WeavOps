type: object

required:
  - username
  - password

properties:
  id:
    type: string
    description: Identificativo MongoDB generato dal server
    readOnly: true
  username:
    type: string
  password:
    type: string
    format: password
    writeOnly: true
  firstName:
    type: string
  lastName:
    type: string
  email:
    type: string
    format: email
  companyName:
    type: string
    maxLength: 200
    description: Nome azienda associato al profilo utente
  vatNumber:
    type: string
    maxLength: 100
    pattern: '^[A-Za-z0-9]*$'
    description: Partita IVA alfanumerica associata al profilo utente

