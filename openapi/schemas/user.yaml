type: object

required:
  - username
  - password

properties:
  id:
    type: string
    description: Identificativo MongoDB generato dal server
    readOnly: true
  username:
    type: string
  password:
    type: string
    format: password
    writeOnly: true
  firstName:
    type: string
  lastName:
    type: string
  email:
    type: string
    format: email