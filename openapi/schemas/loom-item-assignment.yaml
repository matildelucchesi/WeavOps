type: object

required:
  - loomId
  - itemId

properties:
  id:
    type: string
    readOnly: true
  loomId:
    type: string
  itemId:
    type: string
  processId:
    type: string
  status:
    type: string
    enum:
      - QUEUED
      - RUNNING
      - COMPLETED
      - ABANDONED

  fabricCode:
    type: string
    writeOnly: true
    description: Codice Tela obbligatorio alla chiusura con pezze prodotte.
  fabricCertificationId:
    type: string
    writeOnly: true
    description: Certificazione della Tela scelta solo per articoli PARTIAL; assente per Tela non certificata.
