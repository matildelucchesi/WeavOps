type: object

required:
  - customer
  - arrangement

properties:
  id:
    type: string
    description: Identificativo MongoDB generato dal server
    readOnly: true
  arrangementId:
    type: string
  state:
    type: string
    enum:
      - INITIALIZED
      - RUNNING
      - COMPLETED
      - ABANDONED
  customerId:
    type: string
  totalMeters:
    type: number
  metersRun:
    type: number
  processing:
    type: array
    items:
      $ref: './process.yaml'
  expectedEndDate:
    type: string
    format: date-time
  endDate:
    type: string
    format: date-time
  startDate:
    type: string
    format: date-time
  isArchived:
    type: boolean
    default: false
  isDelivered:
    type: boolean
    default: false
  isLate:
    type: boolean
    default: false
  warpWeight:
    type: number
    minimum: 0
    description: Peso di ordito dell'intero articolo in kg.
  weftWeight:
    type: number
    minimum: 0
    description: Peso di trama dell'intero articolo in kg.
  isCertified:
    type: string
    enum: [ALL, NONE, PARTIAL]
    description: Tutte, nessuna o alcune pezze certificate.
  certificationId:
    type: string
    description: Identificativo della Certification selezionata.
  totalWeight:
    type: number
    readOnly: true
    description: Somma del peso di ordito e trama in kg; assente se uno dei pesi non è specificato.
