type: object

required:
  - customer
  - arrangement

properties:
  id:
    type: string
    description: Identificativo MongoDB generato dal server
    readOnly: true
  arrangementId:
    type: string
  state:
    type: string
    enum:
      - INITIALIZED
      - RUNNING
      - COMPLETED
      - ABANDONED
  customerId:
    type: string
  totalMeters:
    type: number
  metersRun:
    type: number
  processing:
    type: array
    items:
      $ref: './process.yaml'
  expectedEndDate:
    type: string
    format: date-time
  endDate:
    type: string
    format: date-time
  startDate:
    type: string
    format: date-time
  isArchived:
    type: boolean
    default: false
  isDelivered:
    type: boolean
    default: false