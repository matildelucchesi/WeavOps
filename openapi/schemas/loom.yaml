type: object

required:
  - serialNumber
  - status

properties:
  id:
    type: string
    description: Identificativo MongoDB generato dal server
    readOnly: true
  serialNumber:
    type: string
  isAssigned:
    type: boolean
    default: false

  status:
    type: string
    enum:
      - WORKING
      - STOPPED
      - MAINTENANCE