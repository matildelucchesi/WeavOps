type: object

required:
  - loomId
  - speed
  - efficiency
  - totalMeters
  - metersRun
  - metersToGo
  - startDate

properties:
  id:
    type: string
    description: Identificativo MongoDB generato dal server
    readOnly: true
  speed:
    type: number
  efficiency:
    type: number
  totalMeters:
    type: number
  metersRun:
    type: number
  metersToGo:
    type: number
  totalPieces:
    type: number
  piecesRun:
    type:  number
  metersPerPiece:
    type: number
  startDate:
    type: string
    format: date-time
  endDate:
    type: string
    format: date-time
  days:
    type: number
    format: float
  expectedEndDate:
    type: string
    format: date-time
  loom:
    $ref: './loom.yaml'
  itemHitsPerDm:
    type: number
  grs:
    type: boolean
  gots:
    type: boolean
  notes:
    type: string
