type: object

required:
  - itemName
  - reedCount
  - reedCM
  - reedHight
  - warpLenght
  - piecesCount
  - pieceLenght
  - warpEndCount
  - hitsPerDm

properties:
  id:
    type: string
    description: Identificativo MongoDB generato dal server
    readOnly: true
  itemName:
    type: string
  reedCount:
    type: number
    description: Numero di denti del pettine - quanti denti ci sono per unità di misura
  reedCM:
    type: number
    description: Numero di centimetri del pettine
  reedHeight:
    type: number
    format: float
    decription: Altezza del pettine in centimetri - altezza del tessuto
  warpLength:
    type: number
    format: float
    description: Lunghezza del filo di ordito in metri
  piecesCount:
    type: number
    format: float
    description: Numero di pezze che devono essere prodotte
  pieceLength:
    type: number
    format: float
    description: Lunghezza di ogni pezza in metri
  warpEndCount:
    type: number
    format: float
    description: Numero fili ordito
  hitsPerDm:
    type: number
    description: Numero di colpi per decimetro
  deliveryDate:
    type: string
    format: date-time
  worksSaturday:
    type: boolean
    description: Indica se la produzione è attiva il sabato.
  saturdayStartTime:
    type: string
    pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    description: Ora di inizio della produzione del sabato nel fuso Europe/Rome.
  saturdayEndTime:
    type: string
    pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    description: Ora di fine della produzione del sabato nel fuso Europe/Rome; se precedente o uguale all'inizio, termina il giorno successivo.
  worksSunday:
    type: boolean
    description: Indica se la produzione è attiva la domenica.
  sundayStartTime:
    type: string
    pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    description: Ora di inizio della produzione della domenica nel fuso Europe/Rome.
  sundayEndTime:
    type: string
    pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    description: Ora di fine della produzione della domenica nel fuso Europe/Rome; se precedente o uguale all'inizio, termina il giorno successivo.

