openapi: 3.0.3
info:
  title: Demo API
  version: 1.0.0
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /services:
    get:
      tags: [Service]
      operationId: getServices
      responses:
        '200':
          description: Servizi del listino.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/service'
  /rates:
    get:
      tags: [Rate]
      operationId: getRates
      responses:
        '200':
          description: Listino tariffe.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/rate'
    post:
      tags: [Rate]
      operationId: createRate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rate'
      responses:
        '201':
          description: Tariffa creata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rate'
        '400':
          description: Fascia, servizio o importo non validi.
        '409':
          description: Fascia sovrapposta a una tariffa dello stesso servizio.
  /rates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Rate]
      operationId: updateRate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rate'
      responses:
        '200':
          description: Tariffa modificata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rate'
        '400':
          description: Fascia, servizio o importo non validi.
        '404':
          description: Tariffa non trovata.
        '409':
          description: Fascia sovrapposta.
    delete:
      tags: [Rate]
      operationId: deleteRate
      responses:
        '204':
          description: Tariffa eliminata.
        '404':
          description: Tariffa non trovata.
  
  /destinations/{id}:
    delete:
      operationId: deleteDestination
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Destinazione eliminata.
        "409":
          description: Destinazione ancora associata a uno o più clienti.
        "404":
          description: Destinazione non trovata.
      tags:
      - Destination
    get:
      operationId: getDestinationById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/destination"
          description: Destinazione.
        "404":
          description: Destinazione non trovata.
      tags:
      - Destination
    put:
      operationId: updateDestination
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/destination"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/destination"
          description: Destinazione.
        "400":
          description: Dati non validi.
        "404":
          description: Destinazione non trovata.
      tags:
      - Destination
  /destinations:
    get:
      operationId: getDestinations
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/destination"
                type: array
          description: Elenco delle aziende di destinazione.
      tags:
      - Destination
    post:
      operationId: createDestination
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/destination"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/destination"
          description: Destinazione creata.
        "400":
          description: Dati non validi.
      tags:
      - Destination
  /fabrics/{id}:
    get:
      operationId: getFabricById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fabric"
          description: Tela prodotta.
        "404":
          description: Tela non trovata.
      tags:
      - Fabric
  /fabrics:
    get:
      operationId: getFabrics
      parameters:
      - in: query
        name: itemId
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/fabric"
                type: array
          description: "Tele prodotte, eventualmente filtrate per articolo."
      tags:
      - Fabric
  /certifications:
    post:
      operationId: createCertification
      tags: [Certification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/certification"
      responses:
        "201":
          description: Certificazione creata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/certification"
        "400":
          description: Codice e descrizione obbligatori.
        "409":
          description: Codice certificazione già presente.
    get:
      operationId: getCertifications
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/certification"
                type: array
          description: Elenco delle certificazioni disponibili.
      tags:
      - Certification
  /looms:
    get:
      operationId: getLooms
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/loom"
                type: array
          description: Lista loom
      summary: Recupera tutti i loom
      tags:
      - Loom
      x-accepts:
      - application/json
      x-tags:
      - tag: Loom
    post:
      operationId: createLoom
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/loom"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/loom"
          description: Loom creato
        "400":
          description: Richiesta non valida
      summary: Crea un loom
      tags:
      - Loom
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Loom
  /looms/delete-multi:
    post:
      operationId: deleteMultiLooms
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteMultiLooms_200_response"
          description: ok
      summary: Elimina più telai contemporaneamente
      tags:
      - Loom
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Loom
  /looms/{id}:
    delete:
      operationId: deleteLoom
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Loom eliminato
        "404":
          description: Loom non trovato
      summary: Elimina un loom
      tags:
      - Loom
      x-accepts:
      - application/json
      x-tags:
      - tag: Loom
    get:
      operationId: getLoomById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/loom"
          description: Loom trovato
        "404":
          description: Loom non trovato
      summary: Recupera un loom tramite id
      tags:
      - Loom
      x-accepts:
      - application/json
      x-tags:
      - tag: Loom
    put:
      operationId: updateLoom
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/loom"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/loom"
          description: Loom aggiornato
        "400":
          description: Richiesta non valida
        "404":
          description: Loom non trovato
      summary: Aggiorna un loom
      tags:
      - Loom
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Loom
  /looms/{id}/add-pieces:
    put:
      operationId: addPieces
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: pieces
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/loom"
          description: Pezzi aggiunti con successo
        "400":
          description: Richiesta non valida
        "404":
          description: Loom non trovato
      summary: Aggiunge il numero di pezze al telaio
      tags:
      - Loom
      x-accepts:
      - application/json
      x-tags:
      - tag: Loom
  /items:
    get:
      operationId: getItems
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/item"
                type: array
          description: Lista item
      summary: Recupera tutti i item
      tags:
      - Item
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
    post:
      operationId: createItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/item"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/item"
          description: Item creato
        "400":
          description: Richiesta non valida
      summary: Crea un item
      tags:
      - Item
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
  /items/delete-multi:
    post:
      operationId: deleteMultiItems
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteMultiItems_200_response"
          description: ok
      summary: Elimina più articoli contemporaneamente
      tags:
      - Item
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
  /items/running-count:
    get:
      operationId: getRunningItemsCount
      responses:
        "200":
          content:
            application/json:
              schema:
                format: double
                type: number
          description: Numero di item in stato RUNNING
      summary: Conta gli item in lavorazione
      tags:
      - Item
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
  /items/{id}:
    delete:
      operationId: deleteItem
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Item eliminato
        "404":
          description: Item non trovato
      summary: Elimina un item
      tags:
      - Item
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
    get:
      operationId: getItemById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/item"
          description: Item trovato
        "404":
          description: Item non trovato
      summary: Recupera un item tramite ID
      tags:
      - Item
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
    put:
      operationId: updateItem
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/item"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/item"
          description: Item aggiornato
        "400":
          description: Richiesta non valida
        "404":
          description: Item non trovato
      summary: Aggiorna un item
      tags:
      - Item
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
  /items/{id}/remaining-meters-to-assign:
    get:
      operationId: getRemainingMetersToAssign
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                format: double
                type: number
          description: Metri ancora da assegnare
        "404":
          description: Item non trovato
      summary: Recupera i metri ancora da assegnare a un item
      tags:
      - Item
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
  /items/{id}/with-arrangement:
    put:
      operationId: updateItemAndArrangement
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/update-item-and-arrangement-request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/item-and-arrangement-response"
          description: Articolo e disposizione aggiornati atomicamente
        "404":
          description: Articolo o disposizione non trovati
        "400":
          description: Disposizione non associata all'articolo
      summary: Aggiorna articolo e disposizione in un'unica transazione
      tags:
      - Item
  /items/{itemId}/processes:
    post:
      operationId: createAssignedProcess
      parameters:
      - in: path
        name: itemId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create-assigned-process-request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/assigned-process-response"
          description: Processo creato, collegato all'articolo e assegnato atomicamente
        "404":
          description: Articolo o telaio non trovati
        "400":
          description: Richiesta non valida
      summary: Crea processo, collegamento all'articolo e assegnamento in un'unica transazione
      tags:
      - Process
  /items/{id}/production-advice:
    get:
      operationId: getProductionAdviceByItemId
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/production-advice"
          description: Previsione e numero di telai consigliati per rispettare la
            consegna
        "404":
          description: Item non trovato
        "422":
          description: Previsione non calcolabile per dati mancanti o non validi
      summary: Calcola il consiglio di produzione per un articolo
      tags:
      - Item
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
  /items/with-arrangement:
    post:
      operationId: createItemWithArrangement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create-item-with-arrangement-request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/item"
          description: Item creato
        "400":
          description: Richiesta non valida
        "404":
          description: Customer non trovato
      summary: Crea item con disposizione e customerName
      tags:
      - Item
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
  /items/items-not-archived:
    get:
      operationId: getItemsNotArchived
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/item"
                type: array
          description: Lista item non archiviati
      summary: Recupera tutti i item non archiviati
      tags:
      - Item
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
  /items/items-archived:
    get:
      operationId: getItemsArchived
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/item"
                type: array
          description: Lista item archiviati
      summary: Recupera tutti i item archiviati
      tags:
      - Item
      x-accepts:
      - application/json
      x-tags:
      - tag: Item
  /arrangements:
    get:
      operationId: getArrangements
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/arrangement"
                type: array
          description: Lista arrangement
      summary: Recupera tutti i arrangement
      tags:
      - Arrangement
      x-accepts:
      - application/json
      x-tags:
      - tag: Arrangement
    post:
      operationId: createArrangement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/arrangement"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/arrangement"
          description: Arrangement creato
        "400":
          description: Richiesta non valida
      summary: Crea un arrangement
      tags:
      - Arrangement
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Arrangement
  /arrangements/{id}:
    delete:
      operationId: deleteArrangement
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Arrangement eliminato
        "404":
          description: Arrangement non trovato
      summary: Elimina un arrangement
      tags:
      - Arrangement
      x-accepts:
      - application/json
      x-tags:
      - tag: Arrangement
    get:
      operationId: getArrangementById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/arrangement"
          description: Arrangement trovato
        "404":
          description: Arrangement non trovato
      summary: Recupera un arrangement tramite ID
      tags:
      - Arrangement
      x-accepts:
      - application/json
      x-tags:
      - tag: Arrangement
    put:
      operationId: updateArrangement
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/arrangement"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/arrangement"
          description: Arrangement aggiornato
        "400":
          description: Richiesta non valida
        "404":
          description: Arrangement non trovato
      summary: Aggiorna un arrangement
      tags:
      - Arrangement
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Arrangement
  /referents:
    get:
      operationId: getReferents
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/referent"
                type: array
          description: Lista referenti
      summary: Recupera tutti i referenti
      tags:
      - Referent
      x-accepts:
      - application/json
      x-tags:
      - tag: Referent
    post:
      operationId: createReferent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/referent"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/referent"
          description: Referent creato
        "400":
          description: Richiesta non valida
      summary: Crea un referente
      tags:
      - Referent
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Referent
  /referents/{id}:
    delete:
      operationId: deleteReferent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Referent eliminato
        "404":
          description: Referent non trovato
      summary: Elimina un referente
      tags:
      - Referent
      x-accepts:
      - application/json
      x-tags:
      - tag: Referent
    get:
      operationId: getReferentById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/referent"
          description: Referent trovato
        "404":
          description: Referent non trovato
      summary: Recupera un referente tramite ID
      tags:
      - Referent
      x-accepts:
      - application/json
      x-tags:
      - tag: Referent
    put:
      operationId: updateReferent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/referent"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/referent"
          description: Referent aggiornato
        "400":
          description: Richiesta non valida
        "404":
          description: Referent non trovato
      summary: Aggiorna un referente
      tags:
      - Referent
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Referent
  /processes:
    get:
      operationId: getProcesses
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/process"
                type: array
          description: Lista processi
      summary: Recupera tutti i processi
      tags:
      - Process
      x-accepts:
      - application/json
      x-tags:
      - tag: Process
    post:
      operationId: createProcess
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/process"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/process"
          description: Process creato
        "400":
          description: Richiesta non valida
      summary: Crea un processo
      tags:
      - Process
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Process
  /processes/{id}:
    delete:
      operationId: deleteProcess
      parameters:
      - in: path
        name: id
        required: true
