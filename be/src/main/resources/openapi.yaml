          minLength: 1
          type: string
        streetNumber:
          description: "Numero civico, inclusi suffissi o SNC."
          minLength: 1
          type: string
        postalCode:
          description: "CAP italiano, inclusi gli eventuali zeri iniziali."
          pattern: "^[0-9]{5}$"
          type: string
        city:
          description: Comune.
          minLength: 1
          type: string
        provinceCode:
